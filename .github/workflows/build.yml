name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Build APK
      run: |
        set +e
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        gradle assembleDebug --stacktrace 2>&1 | tee build.log
        echo "GRADLE_EXIT=$?" >> $GITHUB_ENV

    - name: Show error summary
      if: always()
      run: |
        echo "===================="
        echo "ERROR SUMMARY"
        echo "===================="
        grep -B 2 -A 15 "What went wrong" build.log || echo "no 'What went wrong' found"
        echo ""
        echo "===================="
        echo "LAST 40 LINES"
        echo "===================="
        tail -40 build.log

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: talayar-apk
        path: app/build/outputs/apk/debug/app-debug.apk
